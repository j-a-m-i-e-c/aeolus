# docker-compose.demo.yml — Public demo overlay.
#
# Flips the existing stack into public demo mode. Use it as an overlay on top of
# the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# It (1) turns on the backend AEOLUS_PUBLIC_DEMO flag so /api/auth/demo-session
# is live and the fail-closed PublicDemoGuard constrains public-demo sessions,
# and (2) rebuilds the frontend with VITE_PUBLIC_DEMO baked in, so visitors get
# an anonymous demo session (no login screen), the demo banner, and the
# admin/authoring surfaces hidden.
#
# The seeded `demo` user/group must exist — seed with the same overlay:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml \
#     --profile seed run --rm -e SEED_USER=admin -e SEED_PASS=<pass> seed
#
# NOTE: this is the testing overlay for validating demo mode. The hardened
# public deployment (Cloudflare Tunnel, resource limits, golden/active DB split,
# nightly reset, no exposed ports) is the remaining Phase B work.

services:
  backend:
    environment:
      AEOLUS_PUBLIC_DEMO: "true"
      DEMO_SESSION_MINUTES: "120"
      DEMO_RESET_TIME: "03:30"

  frontend:
    build:
      args:
        VITE_PUBLIC_DEMO: "true"

  # When seeding through this overlay, provision the public demo identity too,
  # and configure the simulated actuators' MQTT command profiles (Phase 2) once
  # the simulator has published its devices.
  seed:
    environment:
      AEOLUS_PUBLIC_DEMO: "true"
      AEOLUS_SIMULATOR_BOOTSTRAP: "true"

  # Phase 2 simulated-hardware runtime. A SEPARATE process that speaks only MQTT
  # to the internal broker — it holds no Aeolus admin credentials and exposes NO
  # ports (Req 10.2, 10.4). Present ONLY in this demo overlay; a normal install
  # never runs it (the base compose has no simulator service and the process is
  # off unless AEOLUS_SIMULATOR_ENABLED=true — Req 10.1, 10.8).
  #
  # Runs the SAME built image as the backend (aeolus-app:local, produced by the
  # backend build) with a different command: the compiled `dist/simulator/index.js`.
  # This makes the simulator a real deployable component — production dependencies
  # are already installed in the image and nothing is fetched or transpiled at
  # runtime (no mounted source, no `npx tsx`).
  simulator:
    image: aeolus-app:local
    container_name: aeolus-simulator
    restart: unless-stopped
    # Host networking so the simulator reaches the broker on localhost:1883, the
    # same way the host-networked backend does. It publishes no ports of its own.
    network_mode: host
    environment:
      AEOLUS_SIMULATOR_ENABLED: "true"
      AEOLUS_SIMULATOR_SCENARIOS: "reference-water"
      MQTT_BROKER_URL: mqtt://localhost:1883
      AEOLUS_SIMULATOR_LOG_LEVEL: ${AEOLUS_SIMULATOR_LOG_LEVEL:-info}
    command: ["node", "dist/simulator/index.js"]
    depends_on:
      - mosquitto
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
