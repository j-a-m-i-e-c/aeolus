server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    # Host CSP. Custom UI now executes ONLY inside the opaque-origin sandbox
    # iframe (see /sandbox.html below), so the host page no longer needs to run
    # dynamically-generated code: 'unsafe-eval' and blob: are removed from
    # script-src (they previously enabled the in-page import(blobUrl) loader).
    # worker-src keeps 'self' blob: because Monaco spawns its language workers
    # from blob URLs — that is worker sourcing, not script-src execution of user
    # code, so it is evaluated separately. frame-src 'self' permits embedding the
    # same-origin sandbox document. NOTE: nginx does not inherit add_header into
    # location blocks that set their own, so the set is repeated below.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'";

    # Sandbox document CSP. Scoped to exactly what a custom component needs to
    # render inside the opaque origin: it may execute the bundled runtime ('self')
    # and the compiled component module (blob:), but it has NO network egress
    # (connect-src 'none') — so the Aeolus UI SDK over the RPC channel is the only
    # way it can interact with Aeolus.
    set $sandbox_csp "default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback — all routes serve index.html, React Router handles the rest
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html — ensures the browser always gets the latest asset references
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Re-declare security headers (a location-level add_header cancels inheritance)
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Sandbox document — served with its own tightened CSP (opaque-origin frame).
    # Never cached so isolation-policy changes apply immediately.
    location = /sandbox.html {
        add_header Content-Security-Policy $sandbox_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # CORS for the opaque-origin sandbox frame. /sandbox.html runs inside an
        # iframe with sandbox="allow-scripts" (no allow-same-origin), so its origin
        # is opaque (null). Its bundled runtime is a module script, and module
        # scripts ALWAYS fetch in CORS mode. From the null origin, /assets/*.js is
        # cross-origin, so without Access-Control-Allow-Origin the browser blocks
        # the load ("CORS header 'Access-Control-Allow-Origin' missing") and the
        # sandbox never completes its handshake. These are public, immutable static
        # bundles (no credentials, nothing origin-sensitive), so a wildcard is safe.
        # The dev server sets the equivalent header in vite.config.ts.
        add_header Access-Control-Allow-Origin "*" always;
    }
}
