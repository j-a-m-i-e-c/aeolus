# mosquitto.demo.conf — broker config for the hardened public demo stack.
#
# The demo broker is INTERNAL to the compose network (docker-compose.public-demo.yml
# never publishes port 1883), holds no real credentials and connects to no real
# devices, so anonymous access is safe here. State is intentionally ephemeral:
# the demo is disposable and resets from a golden snapshot, so the broker does
# not persist across restarts.

listener 1883
allow_anonymous true
persistence false
log_dest stdout
