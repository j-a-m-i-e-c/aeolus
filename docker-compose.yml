services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aeolus-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeolus

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeolus-backend
    restart: unless-stopped
    # Host networking allows UDP broadcast for Kasa device discovery
    # and direct LAN access for Hue bridge communication
    network_mode: host
    pid: host
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3001}
      MQTT_BROKER_URL: mqtt://localhost:1883
      MQTT_TOPICS: "${MQTT_TOPICS:-#}"
      DB_PATH: /app/data/aeolus.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AEOLUS_PROJECT_DIR: /aeolus-host
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/aeolus-host

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aeolus-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - aeolus

volumes:
  mosquitto_data:
  mosquitto_log:
  backend_data:

networks:
  aeolus:
    driver: bridge
