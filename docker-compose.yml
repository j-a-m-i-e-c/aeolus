services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aeolus-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aeolus

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: aeolus-backend
    restart: unless-stopped
    # Host networking allows UDP broadcast for Kasa device discovery
    # and direct LAN access for Hue bridge communication
    network_mode: host
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3001}
      MQTT_BROKER_URL: mqtt://localhost:1883
      MQTT_TOPICS: "${MQTT_TOPICS:-#}"
      DB_PATH: /app/data/aeolus.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mosquitto:
        condition: service_started
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aeolus-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aeolus

volumes:
  mosquitto_data:
  mosquitto_log:
  backend_data:

networks:
  aeolus:
    driver: bridge
