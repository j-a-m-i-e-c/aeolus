services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aeolus-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aeolus

  # Lightweight sidecar that watches the shared password file and sends SIGHUP
  # to the Mosquitto process when it changes. Shares the PID namespace with the
  # mosquitto container so it can signal PID 1 directly — no Docker socket needed.
  mosquitto-reloader:
    image: alpine:3
    container_name: aeolus-mosquitto-reloader
    restart: unless-stopped
    pid: "service:mosquitto"
    depends_on:
      - mosquitto
    volumes:
      - ./mosquitto:/watch:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache inotify-tools > /dev/null 2>&1
        echo "mosquitto-reloader: waiting for /watch/password_file to appear"
        while [ ! -f /watch/password_file ]; do sleep 2; done
        echo "mosquitto-reloader: watching /watch/password_file for changes"
        while inotifywait -e close_write -e moved_to /watch/password_file 2>/dev/null; do
          echo "mosquitto-reloader: password file changed, sending SIGHUP to mosquitto"
          kill -HUP 1
        done
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: aeolus-backend
    restart: unless-stopped
    # Host networking allows UDP broadcast for Kasa device discovery
    # and direct LAN access for Hue bridge communication
    network_mode: host
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3001}
      MQTT_BROKER_URL: mqtt://localhost:1883
      MQTT_TOPICS: "${MQTT_TOPICS:-#}"
      DB_PATH: /app/data/aeolus.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # MQTT provisioning: shared config volume wiring
      MQTT_PASSWORD_FILE: /mosquitto/config/password_file
      MQTT_CONFIG_FILE: /mosquitto/config/mosquitto.conf
      MQTT_RELOAD_STRATEGY: none
    depends_on:
      mosquitto:
        condition: service_started
    volumes:
      - backend_data:/app/data
      - ./mosquitto:/mosquitto/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aeolus-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aeolus

  # One-shot demo seeder. Not started by `docker compose up` (it's behind the
  # "seed" profile). Run it on demand with:
  #   docker compose --profile seed run --rm -e SEED_PASS=yourpass seed
  # or the convenience wrapper:  make seed PASS=yourpass
  # Uses a throwaway Node container + the mounted repo, so no Node install is
  # needed on the host. Credentials are injected via SEED_USER / SEED_PASS.
  seed:
    profiles: ["seed"]
    image: node:22-slim
    network_mode: host
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      API_PORT: ${API_PORT:-3001}
      SEED_USER: ${SEED_USER:-admin}
      SEED_PASS: ${SEED_PASS:-}
    entrypoint: ["sh", "-c", "node scripts/seed-demo.mjs http://localhost:$${API_PORT} \"$$SEED_USER\" \"$$SEED_PASS\""]
    depends_on:
      - backend

volumes:
  mosquitto_data:
  mosquitto_log:
  backend_data:

networks:
  aeolus:
    driver: bridge
