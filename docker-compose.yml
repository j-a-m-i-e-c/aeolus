services:
  mosquitto-config-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - ./mosquitto/mosquitto.conf:/seed/mosquitto.conf:ro
      - mosquitto_config:/mosquitto/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -s /mosquitto/config/mosquitto.conf ]; then
          cp /seed/mosquitto.conf /mosquitto/config/mosquitto.conf
        fi
        chmod 0644 /mosquitto/config/mosquitto.conf

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aeolus-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    depends_on:
      mosquitto-config-init:
        condition: service_completed_successfully
    volumes:
      - mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    # Broker reachability probe using the client shipped in the image. Reflects
    # the default (allow_anonymous true) configuration. This is observability
    # only: the backend does NOT gate startup on broker health (see the backend
    # depends_on note) because the backend retries the initial connection itself,
    # and under managed provisioning (allow_anonymous false) this anonymous probe
    # would fail auth even though the broker is healthy.
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aeolus

  # Lightweight sidecar that watches the shared password file and sends SIGHUP
  # to the Mosquitto process when it changes. Shares the PID namespace with the
  # mosquitto container so it can signal PID 1 directly — no Docker socket needed.
  mosquitto-reloader:
    build:
      context: .
      dockerfile: mosquitto/reloader.Dockerfile
    image: aeolus-mosquitto-reloader:local
    container_name: aeolus-mosquitto-reloader
    restart: unless-stopped
    pid: "service:mosquitto"
    depends_on:
      - mosquitto
    volumes:
      - mosquitto_config:/watch:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "mosquitto-reloader: waiting for /watch/password_file to appear"
        while [ ! -f /watch/password_file ]; do sleep 2; done
        echo "mosquitto-reloader: watching /watch directory for config changes"
        # Watch the DIRECTORY, not the file: the backend replaces password_file
        # atomically (temp file + rename), which swaps the inode. A watch bound
        # to the old file path would stop firing after the first replacement and
        # never sees the rename (moved_to is a directory event). Watching the
        # directory for moved_to/create/close_write reliably catches every
        # atomic write and re-arms each iteration. The dir holds only
        # mosquitto.conf and password_file, so reloading on any change is correct.
        while inotifywait -e close_write -e moved_to -e create /watch 2>/dev/null; do
          echo "mosquitto-reloader: config directory changed, sending SIGHUP to mosquitto"
          kill -HUP 1
        done
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # Tagged so other services (e.g. the demo simulator overlay) can run the same
    # built artifact with a different command instead of rebuilding or running
    # from source.
    image: aeolus-app:local
    container_name: aeolus-backend
    restart: unless-stopped
    # Host networking allows UDP broadcast for Kasa device discovery
    # and direct LAN access for Hue bridge communication
    network_mode: host
    environment:
      # Compose is the main evaluation/install path, so default to production
      # (avoids stack-trace/error-detail exposure). Local source development uses
      # the dev scripts; override with NODE_ENV=development if needed.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3001}
      # Interpolated so a deployment can point the backend at an authenticated
      # broker from .env. The manual broker-security procedure in
      # docs/production-deployment.md relies on this: without interpolation the
      # base value would win and the backend would keep connecting anonymously.
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://localhost:1883}
      MQTT_TOPICS: "${MQTT_TOPICS:-#}"
      DB_PATH: /app/data/aeolus.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Application settings deliberately allowlisted from the project .env.
      # AEOLUS_PUBLIC_DEMO is intentionally NOT propagated here; only the
      # dedicated public-demo overlays may enable that capability envelope.
      JWT_SECRET: "${JWT_SECRET:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-auto}"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-0}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      RATE_LIMIT_RPM: "${RATE_LIMIT_RPM:-1000}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      STATE_HISTORY_MAX: "${STATE_HISTORY_MAX:-100}"
      HISTORY_RECORD_INTERVAL: "${HISTORY_RECORD_INTERVAL:-5000}"
      MAX_CONFIRM_TIMEOUT_MS: "${MAX_CONFIRM_TIMEOUT_MS:-5000}"
      REST_ACTION_TIMEOUT_MS: "${REST_ACTION_TIMEOUT_MS:-7000}"
      MQTT_DISCOVERY_IGNORED_TOPIC_SUFFIXES: "${MQTT_DISCOVERY_IGNORED_TOPIC_SUFFIXES:-set,command,cmd,heartbeat,availability}"
      MQTT_MANAGED_PROVISIONING_ENABLED: "${MQTT_MANAGED_PROVISIONING_ENABLED:-false}"
      MQTT_PROVISIONING_VERIFY_BUDGET_MS: "${MQTT_PROVISIONING_VERIFY_BUDGET_MS:-12000}"
      MQTT_PROVISIONING_VERIFY_POLL_MS: "${MQTT_PROVISIONING_VERIFY_POLL_MS:-500}"
      MQTT_PROVISIONING_VERIFY_TIMEOUT_MS: "${MQTT_PROVISIONING_VERIFY_TIMEOUT_MS:-3000}"
      MQTT_PBKDF2_ITERATIONS: "${MQTT_PBKDF2_ITERATIONS:-100000}"
      MQTT_PUBLISH_USER_NAMESPACE: "${MQTT_PUBLISH_USER_NAMESPACE:-aeolus/pub/}"
      MQTT_PUBLISH_MAX_BYTES: "${MQTT_PUBLISH_MAX_BYTES:-262144}"
      # MQTT provisioning: shared config volume wiring
      MQTT_PASSWORD_FILE: /mosquitto/config/password_file
      MQTT_CONFIG_FILE: /mosquitto/config/mosquitto.conf
      MQTT_RELOAD_STRATEGY: none
    depends_on:
      mosquitto:
        # Intentionally service_started, not service_healthy: the backend retries
        # its initial MQTT connection with backoff, so it must not be blocked from
        # starting when the broker is briefly unready — and a strict health gate
        # would wrongly block boot in secured (allow_anonymous false) mode.
        condition: service_started
    volumes:
      - backend_data:/app/data
      - mosquitto_config:/mosquitto/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aeolus-frontend
    restart: unless-stopped
    ports:
      # The image is built on nginx-unprivileged, which serves on 8080 rather
      # than 80. The published host port is unchanged.
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aeolus

  # One-shot demo seeder. Not started by `docker compose up` (it's behind the
  # "seed" profile). Run it on demand with:
  #   docker compose --profile seed run --rm -e SEED_PASS=yourpass seed
  # or the convenience wrapper:  make seed PASS=yourpass
  # Uses a throwaway Node container + the mounted repo, so no Node install is
  # needed on the host. Credentials are injected via SEED_USER / SEED_PASS.
  seed:
    profiles: ["seed"]
    image: node:24.20.0-slim
    network_mode: host
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      API_PORT: ${API_PORT:-3001}
      SEED_USER: ${SEED_USER:-admin}
      SEED_PASS: ${SEED_PASS:-}
    entrypoint: ["sh", "-c", "node demo/seed/seed.mjs http://localhost:$${API_PORT} \"$$SEED_USER\" \"$$SEED_PASS\""]
    depends_on:
      - backend

volumes:
  mosquitto_config:
  mosquitto_data:
  mosquitto_log:
  backend_data:

networks:
  aeolus:
    driver: bridge
