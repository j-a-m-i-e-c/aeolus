# docker-compose.desktop.yml — OPT-IN desktop/dev override (Docker Desktop).
#
# On Linux (CI, Raspberry Pi), network_mode: host works and exposes all ports,
# which the Pi deployment needs for LAN discovery. That is the default and
# deterministic path — plain `docker compose up` uses host networking.
#
# On Docker Desktop (Windows/Mac), host networking runs inside the VM, so
# containers aren't reachable on localhost. This override switches to bridge
# networking with explicit port mappings for local development and e2e testing.
#
# This file is NOT auto-loaded. Load it explicitly, only when you want bridge
# networking on a desktop/dev machine:
#
#   docker compose -f docker-compose.yml -f docker-compose.desktop.yml up
#
# It is named `docker-compose.desktop.yml` (not `docker-compose.override.yml`)
# precisely so that cloning the repo never silently switches network modes.

services:
  backend:
    # The base file puts the backend on `network_mode: host`. Compose treats
    # `network_mode` and `networks` as mutually exclusive, and an override cannot
    # silently drop an inherited key, so clear it explicitly with `!reset`
    # (Compose v2.24+). Without this the merged project is invalid and
    # `-f docker-compose.yml -f docker-compose.desktop.yml` refuses to run.
    #
    # Join the user-defined `aeolus` bridge rather than `network_mode: bridge`:
    # the default bridge has no DNS for container names, so
    # `mqtt://mosquitto:1883` below would not resolve.
    network_mode: !reset null
    ports:
      - "${API_PORT:-3001}:3001"
    # Override MQTT broker URL to use the container name instead of localhost
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      RATE_LIMIT_RPM: "10000"
      # Provisioning env vars are inherited from the main compose file;
      # only the broker URL needs overriding for bridge networking.
    networks:
      - aeolus

  # The seed helper has to follow the backend off host networking, or `make seed`
  # targets its own empty loopback instead of the API. Same `!reset` treatment,
  # and the target URL becomes the service name now that DNS is available.
  seed:
    network_mode: !reset null
    networks:
      - aeolus
    entrypoint: ["sh", "-c", "node demo/seed/seed.mjs http://backend:$${API_PORT} \"$$SEED_USER\" \"$$SEED_PASS\""]
