name: Reset Public Demo

# Manual, admin-initiated emergency reset of the public demo (restore the golden
# snapshot immediately, e.g. after vandalism). The nightly systemd timer on the
# host handles routine resets; this workflow is the on-demand equivalent.
#
# Uses the same `demo` environment and SSH secrets as Deploy Aeolus Demo:
#   secrets.DEMO_SSH_HOST / DEMO_SSH_USER / DEMO_SSH_KEY, vars.DEMO_APP_DIR
# Gate the `demo` environment with required reviewers so only admins can run it.

on:
  workflow_dispatch: {}

concurrency:
  group: reset-demo
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEMO_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEMO_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run the golden-snapshot reset on the demo host
        env:
          SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          APP_DIR: ${{ vars.DEMO_APP_DIR }}
        run: |
          ssh -i ~/.ssh/id_deploy "${SSH_USER}@${SSH_HOST}" bash -ls <<EOF
          set -euo pipefail
          cd "${APP_DIR}"
          ./scripts/reset-demo.sh
          EOF
