name: Publish Aeolus Demo Release

# Manual release builder. It deliberately DOES NOT SSH to the Lightsail host.
# The host firewall can therefore keep SSH restricted to the operator's IP.
# After this publishes immutable GHCR images, deploy them from an operator PC:
#
#   DEMO_IMAGE_MODE=registry \
#   DEMO_APP_IMAGE=ghcr.io/<owner>/aeolus-demo-app:<sha> \
#   DEMO_FRONTEND_IMAGE=ghcr.io/<owner>/aeolus-demo-frontend:<sha> \
#   ./demo/operations/deploy/deploy-from-pc.sh
#
# For the first deployment you can skip GHCR entirely; demo/operations/deploy/deploy-from-pc.sh
# defaults to building locally and streaming the images over SSH.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or commit SHA) to publish"
        required: true
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-demo-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - id: meta
        name: Resolve immutable release ID
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Backend typecheck
        run: npx tsc --noEmit

      - name: Build backend + simulator bundles
        run: npm run build

      - name: Backend tests
        run: npx vitest run

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend/simulator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            BUILD_COMMIT=${{ needs.verify.outputs.sha }}
            BUILD_DATE=${{ needs.verify.outputs.build_date }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aeolus-demo-app:${{ needs.verify.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/aeolus-demo-app:demo-latest

      - name: Build and publish public frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_PUBLIC_DEMO=true
            VITE_API_URL=${{ vars.DEMO_PUBLIC_ORIGIN || 'https://demo.aeolus.com.au' }}
            VITE_WS_URL=${{ vars.DEMO_PUBLIC_WS_URL || 'wss://demo.aeolus.com.au/ws' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aeolus-demo-frontend:${{ needs.verify.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/aeolus-demo-frontend:demo-latest

      - name: Publish deployment instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Demo release published

          Immutable images:
          SUMMARY
          echo '- `ghcr.io/${{ github.repository_owner }}/aeolus-demo-app:${{ needs.verify.outputs.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- `ghcr.io/${{ github.repository_owner }}/aeolus-demo-frontend:${{ needs.verify.outputs.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'

          Deploy from a source-restricted operator PC with `demo/operations/deploy/deploy-from-pc.sh` in `registry` mode.
          SUMMARY
