name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (repo-wide — backend TS + frontend TSX)
        run: npx eslint . --max-warnings 0

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npx vitest run --coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests with coverage
        run: npm run test:coverage

  # Broker-backed integration + vertical E2E tests. These require a real MQTT 5
  # broker (a throwaway eclipse-mosquitto:2 container) and self-skip anywhere
  # Docker is unavailable — which is every normal (often Windows) dev machine.
  # Running them here as an explicit, named check means the most valuable
  # end-to-end proof (stimulus -> AutomationEngine -> CommandService -> simulator
  # -> ACK + observed lifecycle) is continuously exercised rather than relying on
  # Docker happening to be present inside the coverage job.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Pre-pull MQTT broker image
        run: docker pull eclipse-mosquitto:2

      - name: Run broker-backed integration tests
        # Serial (one file at a time): each broker-backed E2E file starts ONE
        # throwaway mosquitto container in beforeAll and reuses it across its tests.
        # Running files concurrently would still put several container startups in
        # flight at once, and container startup is the least reliable step here. The
        # whole job is ~30s serial, so this trades little wall-clock for reliability.
        run: npx vitest run __integration__ --no-file-parallelism

  sandbox-browser-boundary:
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Aeolus
        run: docker compose up -d --build
      - name: Verify custom UI iframe boundary in Chromium
        run: npx playwright test e2e/sandbox-boundary.spec.ts --project=chromium
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v


  build-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend, frontend, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate backend image on amd64 and arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILD_COMMIT=$(git rev-parse --short HEAD) \
            --build-arg BUILD_DATE=$(git log -1 --format=%cI HEAD) \
            --output=type=cacheonly .

      - name: Validate frontend image on amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 --output=type=cacheonly ./frontend
