name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (repo-wide — backend TS + frontend TSX)
        run: npx eslint . --max-warnings 0

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npx vitest run --coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests with coverage
        run: npm run test:coverage

  # Broker-backed integration + vertical E2E tests. These require a real MQTT 5
  # broker (a throwaway eclipse-mosquitto:2 container) and self-skip anywhere
  # Docker is unavailable — which is every normal (often Windows) dev machine.
  # Running them here as an explicit, named check means the most valuable
  # end-to-end proof (stimulus -> AutomationEngine -> CommandService -> simulator
  # -> ACK + observed lifecycle) is continuously exercised rather than relying on
  # Docker happening to be present inside the coverage job.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Pre-pull MQTT broker image
        run: docker pull eclipse-mosquitto:2

      - name: Run broker-backed integration tests
        # Serial (one file at a time): each broker-backed E2E file starts ONE
        # throwaway mosquitto container in beforeAll and reuses it across its tests.
        # Running files concurrently would still put several container startups in
        # flight at once, and container startup is the least reliable step here. The
        # whole job is ~30s serial, so this trades little wall-clock for reliability.
        run: npx vitest run __integration__ --no-file-parallelism

  # Playwright browser end-to-end tests run on a daily schedule (see
  # .github/workflows/e2e.yml). They're too slow/expensive to run on every push.
  # The daily job checks whether main has new commits since the last run.

  build-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend, frontend, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build backend image
        run: |
          docker build \
            --build-arg BUILD_COMMIT=$(git rev-parse --short HEAD) \
            --build-arg BUILD_DATE=$(git log -1 --format=%cI HEAD) \
            -t aeolus-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t aeolus-frontend:${{ github.sha }} ./frontend
