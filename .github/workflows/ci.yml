name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (repo-wide — backend TS + frontend TSX)
        run: npx eslint . --max-warnings 0

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npx vitest run --coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests with coverage
        run: npm run test:coverage

  # End-to-end tests run on a daily schedule (see .github/workflows/e2e.yml).
  # They're too slow/expensive to run on every push. The daily job checks
  # whether main has new commits since the last successful run.

  build-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build backend image
        run: |
          docker build \
            --build-arg BUILD_COMMIT=$(git rev-parse --short HEAD) \
            --build-arg BUILD_DATE=$(git log -1 --format=%cI HEAD) \
            -t aeolus-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t aeolus-frontend:${{ github.sha }} ./frontend
