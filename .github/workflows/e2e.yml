name: E2E (daily)

# Runs once a day at 06:00 UTC, but only if main has new commits since the
# last successful run. Can also be triggered manually.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check for commits in the last 24h
        id: check
        run: |
          COMMITS=$(git log --oneline --since="24 hours ago" --count | head -1)
          COUNT=$(git log --oneline --since="24 hours ago" | wc -l)
          if [ "$COUNT" -gt "0" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Found $COUNT commit(s) in the last 24h — running e2e."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new commits in 24h — skipping e2e."
          fi

  e2e:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The disposable stack (own project, volume and ports, AEOLUS_E2E=true). The
      # suite refuses any backend without that marker (e2e/global-setup.ts).
      - name: Start the disposable E2E stack
        run: docker compose --project-directory . -f e2e/docker-compose.e2e.yml up -d --build

      - name: Run Playwright e2e
        run: npm run test:e2e

      # Logs are written to a file and printed only if the credential scan finds no
      # API key in them; CI logs are readable by anyone who can see the run.
      - name: Backend logs (on failure)
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker compose --project-directory . -f e2e/docker-compose.e2e.yml logs --no-color --tail 200 > e2e-logs/stack.log 2>&1 || true
          if node scripts/e2e/credential-scan.mjs e2e-logs; then
            cat e2e-logs/stack.log
          else
            echo "Backend logs withheld: the credential scan found an API key in them."
            exit 1
          fi

      # The Project API spec issues a real key. Playwright's global teardown already
      # scanned test-results/; the HTML report is written after it, so scan both here.
      # A finding fails the job and blocks the upload below.
      - name: Scan artifacts for API keys
        id: credential-scan
        if: always()
        run: node scripts/e2e/credential-scan.mjs test-results playwright-report

      - name: Upload Playwright report
        if: failure() && steps.credential-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      - name: Tear down
        if: always()
        run: docker compose --project-directory . -f e2e/docker-compose.e2e.yml down -v
