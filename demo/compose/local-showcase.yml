# demo/compose/local-showcase.yml — Aeolus + Showcase (Mode B).
#
# Adds simulated hardware and the showcase seed bootstrap to an OTHERWISE NORMAL
# Aeolus stack. Overlay it on the base compose file:
#
#   docker compose --project-directory . -f docker-compose.yml -f demo/compose/local-showcase.yml up -d --build
#
# or just:  make showcase
#
# What this is NOT
# ----------------
# It does not enable public-demo mode. It used to, and that conflation was the
# problem: the only way to get simulated hardware locally was to also become an
# anonymous read-only visitor on your own machine, with authoring hidden and the
# fail-closed PublicDemoGuard rejecting most of the API. Reviewing the showcase and
# restricting a public visitor are unrelated concerns that happened to share a file
# (showcase-cleanup §11.1).
#
# So this is the full, unrestricted application — normal login, normal admin, normal
# authoring — plus simulated devices and seeded showcase content. It is what you want
# on a Pi while developing or reviewing the showcase.
#
# The two things that DO want visitor restrictions have their own files:
#
#   demo/compose/public-demo-local.yml  — reproduce visitor behaviour locally.
#                                         An overlay: it stacks ON TOP of this file,
#                                         so the simulator is defined here once.
#   demo/compose/hosted-runtime.yml     — the internet-facing demo.aeolus.com.au.
#                                         Deliberately STANDALONE, not an overlay of
#                                         anything: the base stack uses host
#                                         networking for LAN discovery and the public
#                                         demo must not, so it declares its own
#                                         services, including its own simulator.

services:
  # Seeding through this overlay configures the simulated actuators' MQTT command
  # profiles once the simulator has published its devices. No public-demo identity
  # is provisioned — that belongs to the public-demo overlays, which add their own
  # AEOLUS_PUBLIC_DEMO here.
  seed:
    environment:
      AEOLUS_SIMULATOR_BOOTSTRAP: "true"

  # Simulated-hardware runtime. A SEPARATE process that speaks only MQTT to the
  # internal broker — it holds no Aeolus admin credentials and exposes NO ports
  # (Req 10.2, 10.4). A normal install never runs it: the base compose has no
  # simulator service, and the process refuses to start unless
  # AEOLUS_SIMULATOR_ENABLED=true (Req 10.1, 10.8).
  #
  # Runs the SAME built image as the backend (aeolus-app:local, produced by the
  # backend build) with a different command: the compiled `dist/simulator/index.js`.
  # This makes the simulator a real deployable component — production dependencies
  # are already installed in the image and nothing is fetched or transpiled at
  # runtime (no mounted source, no `npx tsx`).
  simulator:
    image: aeolus-app:local
    container_name: aeolus-simulator
    restart: unless-stopped
    # Host networking so the simulator reaches the broker on localhost:1883, the
    # same way the host-networked backend does. It publishes no ports of its own.
    network_mode: host
    environment:
      AEOLUS_SIMULATOR_ENABLED: "true"
      # Unset means the showcase set, defined once as SHOWCASE_SCENARIO_KEYS in
      # src/simulator/scenarios/index.ts. Set it to a comma-separated list to trim.
      AEOLUS_SIMULATOR_SCENARIOS: ${AEOLUS_SIMULATOR_SCENARIOS:-}
      MQTT_BROKER_URL: mqtt://localhost:1883
      AEOLUS_SIMULATOR_LOG_LEVEL: ${AEOLUS_SIMULATOR_LOG_LEVEL:-info}
    command: ["node", "dist/simulator/index.js"]
    depends_on:
      - mosquitto
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
