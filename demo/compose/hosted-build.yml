# Build-only overlay for the HOSTED public showcase runtime.
# Not used by ordinary Aeolus or the local demo/compose/local-showcase.yml showcase.
#
# The public deployment compose file intentionally contains no build contexts:
# production hosts pull/load immutable images and only restart containers. Use
# this overlay when building a release on a developer machine:
#
#   docker compose --project-directory . \
#     -f demo/compose/hosted-runtime.yml \
#     -f demo/compose/hosted-build.yml \
#     build backend frontend
#
# The simulator shares the backend image and therefore has no separate build.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_DEMO: "true"
        VITE_API_URL: ${DEMO_PUBLIC_ORIGIN:-https://demo.aeolus.com.au}
        VITE_WS_URL: ${DEMO_PUBLIC_WS_URL:-wss://demo.aeolus.com.au/ws}
